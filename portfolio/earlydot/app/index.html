<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EARLY DOT 화면 | 양혁준 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="app.css">
<style>
  /* 다른 페이지(사례 페이지 · 3D 부스) 안에 끼워 넣는 휴대폰 한 대 */
  html, body { height: 100%; }
  body { font-family: Pretendard, "Malgun Gothic", sans-serif; background: transparent; color: #0f1d33; -webkit-font-smoothing: antialiased; }
  .phone { height: 100%; max-width: 420px; margin: 0 auto; border-radius: 46px; padding: 10px; background: #0b1220; box-shadow: inset 0 0 0 2px #2a3446; }
  .screen { position: relative; height: 100%; border-radius: 37px; overflow: hidden; background: #f6f8fb; display: flex; flex-direction: column; }
  .status { flex: none; height: 32px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px 0 28px; font-size: 13px; font-weight: 700; }
  .status i { width: 86px; height: 22px; border-radius: 12px; background: #0b1220; margin-top: 4px; }
  .status span:last-child { letter-spacing: 1px; }
  #app { flex: 1; min-height: 0; }
</style>
</head>
<body>
<div class="phone" aria-label="EARLY DOT 휴대폰 화면">
  <div class="screen">
    <div class="status" aria-hidden="true"><span>9:41</span><i></i><span>▮▮▮</span></div>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script type="module">
import { login } from './js/data.js';
import './js/main.js';
// 바깥 페이지의 '바로 가 보기' 버튼이 부른다: 역할로 들어가 해당 화면으로
window.edJump = (role, hash) => {
  login(role);
  if (location.hash === hash) dispatchEvent(new HashChangeEvent('hashchange')); else location.hash = hash;
};
</script>
</body>
</html>
